{% extends "base.html" %}

{% block main %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="display-1 fw-bold">{{ error_code }}</h1>
            <h2 class="mb-4">{{ error_title }}</h2>
            <p class="lead mb-4">{{ error_message }}</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary" style="background-color: #b82828; border-color: #b82828;">Retour à l'accueil</a>
        </div>
    </div>
</div>
{% endblock %}
