{% extends "base.html" %}
{% block main %}
<form method="post">
    <h1 class="mb-4" >
        <input type="text" class="form-control" id="nom" name="nom" value="{{ reunion.nom }}" required>
    </h1>
    
    <div class="row justify-content-center">
            <!--Cartes-->
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="card h-100 text-center shadow-sm">
                    <div class="card-body d-flex flex-column justify-content-center">
                        <input type="date" class="form-control" id="date" name="date" value="{{ reunion.dateRE.strftime('%Y-%m-%d') }}" required>
                    </div>
                </div>
            </div>
    
            
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="card h-100 text-center shadow-sm">
                    <div class="card-body d-flex flex-column justify-content-center">
                        <input type="text" class="form-control" id="lieu" name="lieu" value="{{ reunion.lieu }}" required>
                    </div>
                </div>
            </div>
        </div>
        <!--Fin Carte-->
        
        <h2>Description :</h2>
        <div class="mb-3">
            <textarea name="description" class="form-control" rows="5" placeholder="Rapport de la réunion..." required>{{ reunion.rapportRE }}</textarea>
        </div>
    <div class="d-flex justify-content-center">
        <a href="{{ url_for('reunion_view', idReunion=reunion.id) }}" class="btn btn-secondary">Annuler</a>
        <button type="submit" class="btn btn-primary ms-2">Sauvegarder les modifications</button>
    </div>
</form>
{% endblock %}
